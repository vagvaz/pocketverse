[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pocketverse"
version = "0.1.0"
description = "Composable, unprivileged sandboxes for AI agents: bubblewrap + overlayfs + allowlist-network proxy, configured via YAML"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.5",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
telemetry = [
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.20.0",
    "opentelemetry-exporter-otlp-proto-http>=1.20.0",
]

[project.scripts]
pocket = "pocketverse.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["pocketverse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
